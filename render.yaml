databases:
  - name: snai3i-postgres
    databaseName: snai3i
    user: snai3i_user
    plan: free

services:
  - type: web
    name: snai3i-points-tracker
    runtime: python
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn school_project.wsgi:application --workers 1 --threads 8 --timeout 60"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: snai3i-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.18.0
      - key: ADMIN_EMAIL
        value: admin@snai3i.com  # change to your real admin email before the first deploy
      - key: ADMIN_PASSWORD
        generateValue: true  # view it in the Render dashboard (Environment tab)
      - key: SITE_URL
        sync: false  # e.g. https://your-app.onrender.com (used for canonical/SEO tags at build time)
